name: Tests

# Runs the KitchenSink4XL test suite.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      # Three platforms, Python 3.12 (the minimum) and 3.14. The file tier is
      # platform-neutral; the COM tests are marked `com` and skip themselves
      # off Windows.
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        # The com extra is not installed: the COM tier needs Windows with
        # Excel, which a runner does not have. Its tests skip themselves.
        run: pip install -e ".[dev]"
      - name: Run test suite
        run: python -m pytest tests/unit -q
