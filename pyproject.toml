[project]
# The shared editing core. It carries no licensing content and does not run
# on its own: an edition distribution (kitchensink4xl or
# kitchensink4xl-business, both under packages/) supplies the license
# policy and the console commands.
name = "kitchensink4xl-core"
version = "2.0.0"
description = "Read and edit Excel (.xlsx) files with your AI assistant: 131 actions, a backup before every change, formulas, tables, CSV and JSON, and a clear label on every calculated, cached or missing value. Local MCP server for Claude Code, Codex CLI and other MCP clients."
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "NOTICE.md"]
authors = [{ name = "KitchenSink4AI", email = "support@kitchensink4.ai" }]
keywords = [
    "mcp", "excel", "xlsx", "ooxml", "spreadsheet", "claude",
    "model-context-protocol", "openpyxl", "pivot-tables",
    "formulas", "conditional-formatting", "data-validation", "charts",
    "round-trip-safety", "tiered-loading", "recalculation", "lambda",
    "named-ranges", "csv", "office", "com",
]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial :: Spreadsheet",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Markup :: XML",
]
requires-python = ">=3.12"
dependencies = [
    # fastmcp is pinned to one major version: a minor bump once moved the
    # visibility API.
    "fastmcp>=3.4,<4",
    "openpyxl",
    # lxml backs the raw OOXML escape hatch; regex backs the caller-pattern
    # ReDoS guard (core/_regex.py).
    "lxml",
    "regex",
    # packaging backs the startup update check's version comparison
    # (prerelease-aware, so a stable build is never offered an rc).
    "packaging",
]

[project.optional-dependencies]
# The COM tier is Windows + Excel only; keep pywin32 an opt-in extra so the
# cross-platform file-based tier installs anywhere. Also platform-gated so a
# non-Windows install of the extra is a no-op rather than a build failure.
com = ["pywin32; sys_platform == 'win32'"]
dev = [
    "build",
    "cryptography>=42",
    "pytest",
    "pytest-timeout",
    # Pillow backs the image tools and psutil backs COM process identity.
    # Neither is a runtime requirement: without them the image tools refuse
    # honestly and a PID's creation time reads as unknown. The tests for both
    # behaviors need the real library present, so they belong here.
    "pillow",
    "psutil",
    # The edition build runs `python -m build --no-isolation`, so the backend
    # has to be present in the environment running the tests.
    "setuptools>=77",
]

[project.urls]
Homepage = "https://kitchensink4.ai"
Documentation = "https://github.com/KitchenSink4AI/KitchenSink4XL#readme"
Repository = "https://github.com/KitchenSink4AI/KitchenSink4XL"
Issues = "https://github.com/KitchenSink4AI/KitchenSink4XL/issues"
Changelog = "https://github.com/KitchenSink4AI/KitchenSink4XL/releases"
"Agent manifest (llms.txt)" = "https://github.com/KitchenSink4AI/KitchenSink4XL/blob/main/docs/llms.txt"
"Commercial license" = "https://github.com/KitchenSink4AI/KitchenSink4XL/issues/new?template=commercial_license.yml"

# No [project.scripts]. The core cannot start without an injected policy, so
# the console commands live on the edition distributions in packages/ and
# keep their existing public names there.

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120
# An unarmed timeout is no timeout: refuse to run without the plugin.
required_plugins = ["pytest-timeout"]
markers = [
    "com: needs an interactive Excel instance (auto-skipped where Excel is unavailable)",
    "public_copy: release gate on README/site figures; runs only with KS4XL_RELEASE_GATE=1",
    "business_sources: needs the Business edition sources; skipped where they are absent (the public release ships the Community edition only)",
]
